<!DOCTYPE html>
<html>
<head>

<title>Students</title>

<style>

body {
    font-family: Arial;
    margin: 0;
    background: #f5f3fa;
}

.header {
    background: #5420a8;
    color: white;
    padding: 20px;
}

.container {
    padding: 25px;
}

table {
    width: 100%;
    background: white;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

th {
    background: #5420a8;
    color: white;
}

</style>

</head>

<body>

<div class="header">
<h2>Students</h2>
</div>

<div class="container">

<table>

<thead>

<tr>
<th>Student ID</th>
<th>Name</th>
<th>Email</th>
<th>Class</th>
<th>Course</th>
</tr>

</thead>

<tbody id="studentsTable">

</tbody>

</table>

</div>

<script>

async function loadStudents() {

    const response =
        await fetch(
            "/api/teacher/students"
        );

    const data =
        await response.json();

    if (!data.success) {

        window.location.href =
            "/login.html";

        return;
    }

    const table =
        document.getElementById(
            "studentsTable"
        );

    table.innerHTML = "";

    data.students.forEach(
        student => {

            table.innerHTML += `

                <tr>

                    <td>
                        ${student.studentId}
                    </td>

                    <td>
                        ${student.name}
                    </td>

                    <td>
                        ${student.email}
                    </td>

                    <td>
                        ${student.className || "-"}
                    </td>

                    <td>
                        ${student.course || "-"}
                    </td>

                </tr>
            `;
        }
    );
}

loadStudents();

</script>

</body>
</html>
