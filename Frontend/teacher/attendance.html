<!DOCTYPE html>
<html>

<head>

<title>Teacher Attendance</title>

<style>

body {
    font-family: Arial;
    margin: 0;
    background: #f5f3fa;
}

.header {
    background: #5420a8;
    color: white;
    padding: 20px;
}

.container {
    padding: 25px;
}

input,
select {
    padding: 10px;
    margin: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px 18px;
    margin: 5px;
    background: #5420a8;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #3f167f;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.present-button {
    background: green;
}

.present-button:hover {
    background: #006400;
}

.absent-button {
    background: red;
}

.absent-button:hover {
    background: #b00000;
}

.active-present {
    background: green;
}

.active-absent {
    background: red;
}

#message {
    font-weight: bold;
    margin: 15px 0;
}

.session-box {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.student {
    background: white;
    padding: 18px;
    margin: 10px 0;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.student-info {
    display: inline-block;
    min-width: 250px;
}

.student-name {
    font-size: 17px;
    font-weight: bold;
}

.student-id {
    color: #666;
    margin-top: 5px;
}

.status {
    font-weight: bold;
    margin: 10px 0;
}

.present {
    color: green;
    font-weight: bold;
}

.absent {
    color: red;
    font-weight: bold;
}

.waiting {
    color: #777;
    font-weight: bold;
}

.attendance-buttons {
    margin-top: 10px;
}

.summary {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary span {
    margin-right: 25px;
    font-weight: bold;
}

</style>

</head>


<body>


<div class="header">

    <h2>Teacher Attendance</h2>

</div>


<div class="container">


<h3>Start Attendance</h3>


<input
    id="subject"
    placeholder="Subject"
>


<input
    id="className"
    placeholder="Class e.g. SYCS"
>


<br>


<button
    id="startButton"
    onclick="startSession()"
>
    Start Attendance
</button>


<button
    id="endButton"
    onclick="endSession()"
    disabled
>
    End Attendance
</button>


<p id="message"></p>


<div
    class="session-box"
    id="sessionBox"
    style="display:none;"
>

    <h3>Active Attendance Session</h3>

    <p>
        Subject:
        <strong id="activeSubject"></strong>
    </p>

    <p>
        Class:
        <strong id="activeClass"></strong>
    </p>

    <p>
        Status:
        <strong class="present">
            ACTIVE
        </strong>
    </p>

</div>


<div
    class="summary"
    id="summaryBox"
    style="display:none;"
>

    <span>
        Total Students:
        <strong id="totalStudents">0</strong>
    </span>

    <span class="present">
        Present:
        <strong id="presentCount">0</strong>
    </span>

    <span class="absent">
        Absent:
        <strong id="absentCount">0</strong>
    </span>

</div>


<hr>


<h3>Student Attendance</h3>


<div id="students">

    <p class="waiting">
        No active attendance session.
    </p>

</div>


</div>


<script>


let refreshTimer = null;


/* =====================================================
   START ATTENDANCE SESSION
===================================================== */

async function startSession() {

    const subject =
        document.getElementById("subject")
        .value
        .trim();

    const className =
        document.getElementById("className")
        .value
        .trim();


    if (!subject || !className) {

        document.getElementById("message")
            .innerText =
            "Please enter subject and class.";

        return;
    }


    try {

        const response = await fetch(
            "/api/teacher/attendance/session/start",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    subject: subject,
                    className: className
                })
            }
        );


        const data = await response.json();


        document.getElementById("message")
            .innerText =
            data.message || "";


        if (data.success) {

            document.getElementById("startButton")
                .disabled = true;

            document.getElementById("endButton")
                .disabled = false;

            document.getElementById("subject")
                .disabled = true;

            document.getElementById("className")
                .disabled = true;


            showSession(
                subject,
                className
            );


            document.getElementById("summaryBox")
                .style.display = "block";


            await loadAttendance();


            if (!refreshTimer) {

                refreshTimer =
                    setInterval(
                        loadAttendance,
                        3000
                    );
            }

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById("message")
            .innerText =
            "Cannot connect to server.";

    }

}


/* =====================================================
   END ATTENDANCE SESSION
===================================================== */

async function endSession() {

    try {

        const response = await fetch(
            "/api/teacher/attendance/session/end",
            {
                method: "POST",

                credentials: "include"
            }
        );


        const data =
            await response.json();


        document.getElementById("message")
            .innerText =
            data.message || "";


        if (data.success) {

            document.getElementById("startButton")
                .disabled = false;

            document.getElementById("endButton")
                .disabled = true;

            document.getElementById("subject")
                .disabled = false;

            document.getElementById("className")
                .disabled = false;


            document.getElementById("sessionBox")
                .style.display = "none";


            document.getElementById("summaryBox")
                .style.display = "none";


            document.getElementById("students")
                .innerHTML =
                "<p class='waiting'>Attendance session ended.</p>";


            if (refreshTimer) {

                clearInterval(refreshTimer);

                refreshTimer = null;
            }

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById("message")
            .innerText =
            "Cannot connect to server.";

    }

}


/* =====================================================
   SHOW ACTIVE SESSION
===================================================== */

function showSession(
    subject,
    className
) {

    document.getElementById("sessionBox")
        .style.display = "block";


    document.getElementById("activeSubject")
        .innerText =
        subject;


    document.getElementById("activeClass")
        .innerText =
        className;

}


/* =====================================================
   LOAD ALL STUDENTS FOR ACTIVE SESSION
===================================================== */

async function loadAttendance() {

    try {

        const response = await fetch(
            "/api/teacher/attendance/session/records",
            {
                credentials: "include"
            }
        );


        const data =
            await response.json();


        if (!data.success) {

            return;
        }


        const container =
            document.getElementById("students");


        if (!data.students ||
            data.students.length === 0) {

            container.innerHTML =
                "<p class='waiting'>No students found for this class.</p>";

            updateSummary([]);

            return;
        }


        container.innerHTML = "";


        data.students.forEach(
            student => {

                const div =
                    document.createElement("div");

                div.className =
                    "student";


                let status =
                    student.status || "Not Marked";


                let statusClass = "";


                if (
                    status.toLowerCase()
                    === "present"
                ) {

                    statusClass =
                        "present";

                }
                else if (
                    status.toLowerCase()
                    === "absent"
                ) {

                    statusClass =
                        "absent";

                }


                div.innerHTML = `

                    <div class="student-info">

                        <div class="student-name">
                            ${student.studentName}
                        </div>

                        <div class="student-id">
                            Student ID:
                            ${student.studentId}
                        </div>

                        <div class="status">
                            Status:
                            <span class="${statusClass}">
                                ${status}
                            </span>
                        </div>

                    </div>


                    <div class="attendance-buttons">

                        <button
                            class="present-button"
                            onclick="markAttendance(
                                '${student.studentId}',
                                'Present'
                            )"
                        >
                            Present
                        </button>


                        <button
                            class="absent-button"
                            onclick="markAttendance(
                                '${student.studentId}',
                                'Absent'
                            )"
                        >
                            Absent
                        </button>

                    </div>

                `;


                container.appendChild(div);

            }
        );


        updateSummary(
            data.students
        );

    }
    catch (error) {

        console.error(
            "Load Attendance Error:",
            error
        );

    }

}


/* =====================================================
   MARK STUDENT PRESENT / ABSENT
===================================================== */

async function markAttendance(
    studentId,
    status
) {

    try {

        const response = await fetch(
            "/api/teacher/attendance/mark",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({

                    studentId:
                        studentId,

                    status:
                        status

                })
            }
        );


        const data =
            await response.json();


        document.getElementById("message")
            .innerText =
            data.message || "";


        if (data.success) {

            await loadAttendance();

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById("message")
            .innerText =
            "Unable to save attendance.";

    }

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(
    students
) {

    let total = students.length;

    let present = 0;

    let absent = 0;


    students.forEach(
        student => {

            const status =
                String(
                    student.status || ""
                ).toLowerCase();


            if (status === "present") {

                present++;

            }
            else if (status === "absent") {

                absent++;

            }

        }
    );


    document.getElementById("totalStudents")
        .innerText =
        total;


    document.getElementById("presentCount")
        .innerText =
        present;


    document.getElementById("absentCount")
        .innerText =
        absent;

}


/* =====================================================
   CHECK CURRENT SESSION
===================================================== */

async function checkCurrentSession() {

    try {

        const response = await fetch(
            "/api/teacher/attendance/session/current",
            {
                credentials: "include"
            }
        );


        const data =
            await response.json();


        if (
            data.success &&
            data.active &&
            data.session
        ) {

            const sessionData =
                data.session;


            document.getElementById("subject")
                .value =
                sessionData.subject;


            document.getElementById("className")
                .value =
                sessionData.className;


            document.getElementById("subject")
                .disabled = true;


            document.getElementById("className")
                .disabled = true;


            document.getElementById("startButton")
                .disabled = true;


            document.getElementById("endButton")
                .disabled = false;


            showSession(
                sessionData.subject,
                sessionData.className
            );


            document.getElementById("summaryBox")
                .style.display = "block";


            await loadAttendance();


            if (!refreshTimer) {

                refreshTimer =
                    setInterval(
                        loadAttendance,
                        3000
                    );
            }

        }

    }
    catch (error) {

        console.log(error);

    }

}


/* =====================================================
   START CHECK
===================================================== */

checkCurrentSession();


</script>


</body>

</html>
