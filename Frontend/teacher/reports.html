<!DOCTYPE html>
<html>
<head>

<title>Teacher Reports</title>

<style>

body {
    font-family: Arial;
    background: #f5f3fa;
    margin: 0;
}

.header {
    background: #5420a8;
    color: white;
    padding: 20px;
}

.container {
    padding: 25px;
}

table {
    width: 100%;
    background: white;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

th {
    background: #5420a8;
    color: white;
}

</style>

</head>

<body>

<div class="header">
<h2>Student Performance Reports</h2>
</div>

<div class="container">

<button onclick="window.print()">
Print Report
</button>

<table>

<thead>

<tr>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Attendance</th>

<th>Average Marks</th>

<th>Risk</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

<script>

async function loadReport() {

    const response =
        await fetch(
            "/api/teacher/reports"
        );

    const data =
        await response.json();

    if (!data.success) {

        window.location.href =
            "/login.html";

        return;
    }

    const table =
        document.getElementById(
            "reportTable"
        );

    table.innerHTML = "";

    data.report.forEach(
        item => {

            table.innerHTML += `

                <tr>

                    <td>
                        ${item.studentId}
                    </td>

                    <td>
                        ${item.studentName}
                    </td>

                    <td>
                        ${item.className || "-"}
                    </td>

                    <td>
                        ${item.attendance}%
                    </td>

                    <td>
                        ${item.averageMarks}%
                    </td>

                    <td>
                        ${item.risk}
                    </td>

                </tr>
            `;
        }
    );
}

loadReport();

</script>

</body>
</html>
