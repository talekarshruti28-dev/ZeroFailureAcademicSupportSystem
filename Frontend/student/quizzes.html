<style>

* {

}

body {
    margin: 0;

/* HEADER */

.header {
    background: linear-gradient(135deg, #5420a8, #7b3fc5);

.back-btn {

    font-weight: bold;
}

/* MAIN */

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

/* SUBJECTS */

.subject-box {
    background: white;
    padding: 20px;
    border-radius: 12px;

    margin-bottom: 25px;
}

    margin-top: 0;
    color: #5420a8;
}

    flex-wrap: wrap;
    gap: 10px;
}

    border-radius: 7px;
    background: #eee;
    color: #5420a8;
    font-weight: bold;
    cursor: pointer;
}

.subject-btn:hover {
    background: #5420a8;
    color: white;
}

}

/* QUIZ */

    padding: 25px;

}

.question {

    padding: 20px;
    margin-bottom: 18px;
}

    color: #333;
}

.option {

    cursor: pointer;
}

.option:hover {

}

    margin-right: 10px;
}

/* SUBMIT */

    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #5420a8;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #3d147d;
}

/* RESULT */

    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);

    margin: 20px 0;

    margin: 25px 0;

    margin-bottom: 15px;

.graph-label {
    margin-bottom: 5px;
    font-weight: bold;

.bar-background {

/* =========================================================
   CURRENT QUIZ
   ========================================================= */

let currentSubject = "";

let currentQuestions = [];


/* =========================================================
   LOAD QUIZ
   ========================================================= */

function loadQuiz(subject, button) {

    currentSubject = subject;

    currentQuestions =
        quizzes[subject];


    /* Active button */

    document
        .querySelectorAll(".subject-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    button.classList.add("active");


    /* Hide old result */

    document.getElementById(
        "result"
    ).style.display = "none";


    /* Show quiz */

    document.getElementById(
        "quizContainer"
    ).style.display = "block";


    document.getElementById(
        "quizTitle"
    ).innerText =
        subject + " Quiz";


    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML = "";


    /* Create questions */

    currentQuestions.forEach(
        (q, index) => {

            const questionDiv =
                document.createElement("div");

            questionDiv.className =
                "question";


            let html =
                "<h3>" +
                (index + 1) +
                ". " +
                q.question +
                "</h3>";


            q.options.forEach(
                option => {

                    html +=
                        '<label class="option">' +

                        '<input type="radio" ' +

                        'name="question' +
                        index +
                        '" ' +

                        'value="' +
                        option.replace(/"/g, "&quot;") +
                        '" required>' +

                        option +

                        '</label>';

                }
            );


            questionDiv.innerHTML =
                html;


            container.appendChild(
                questionDiv
            );

        }
    );


    window.scrollTo({
        top: document
            .getElementById("quizContainer")
            .offsetTop - 20,
        behavior: "smooth"
    });

}


/* =========================================================
   SUBMIT QUIZ
   ========================================================= */

document.getElementById(
    "quizForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!currentSubject ||
            currentQuestions.length === 0) {

            showMessage(
                "Please select a subject first.",
                "error"
            );

            return;
        }


        let score = 0;

        const answers = [];


        /* Check every answer */

        currentQuestions.forEach(
            (q, index) => {

                const selected =
                    document.querySelector(
                        'input[name="question' +
                        index +
                        '"]:checked'
                    );


                const selectedAnswer =
                    selected
                    ? selected.value
                    : "";


                const isCorrect =
                    selectedAnswer ===
                    q.answer;


                if (isCorrect) {
                    score++;
                }


                answers.push({

                    question:
                        q.question,

                    selectedAnswer:
                        selectedAnswer,

                    correctAnswer:
                        q.answer,

                    isCorrect:
                        isCorrect

                });

            }
        );


        const total =
            currentQuestions.length;


        const percentage =
            (score / total) * 100;


        /* Performance */

        let performance = "";


        if (percentage >= 80) {

            performance = "Excellent";

        } else if (percentage >= 60) {

            performance = "Good";

        } else if (percentage >= 40) {

            performance = "Average";

        } else {

            performance = "Needs Improvement";

        }


        /* Show result immediately */

        showResult(
            score,
            total,
            percentage,
            performance,
            answers
        );


        /* Save result to Flask */

        try {

            const response =
                await fetch(
                    API_URL +
                    "/api/student/quizzes/result",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({

                                quizId:
                                    currentSubject,

                                subject:
                                    currentSubject,

                                score:
                                    score,

                                total:
                                    total,

                                answers:
                                    answers

                            })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                showMessage(
                    data.message ||
                    "Result was displayed but could not be saved.",
                    "error"
                );

            } else {

                showMessage(
                    "Quiz completed and result saved successfully.",
                    "success"
                );

            }

        }

        catch(error) {

            console.error(
                "QUIZ SAVE ERROR:",
                error
            );


            showMessage(
                "Your result is displayed, but it could not be saved to the server.",
                "error"
            );

        }

    }
);


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult(
    score,
    total,
    percentage,
    performance,
    answers
) {

    const result =
        document.getElementById(
            "result"
        );


    result.style.display =
        "block";


    document.getElementById(
        "marks"
    ).innerText =
        score + " / " + total;


    document.getElementById(
        "percentage"
    ).innerText =
        percentage.toFixed(2) + "%";


    document.getElementById(
        "performance"
    ).innerText =
        performance;


    /* Count correct/wrong */

    const correct =
        answers.filter(
            a => a.isCorrect
        ).length;


    const wrong =
        total - correct;


    /* Graph */

    setTimeout(
        function() {

            document.getElementById(
                "correctBar"
            ).style.width =
                (correct / total * 100) + "%";


            document.getElementById(
                "wrongBar"
            ).style.width =
                (wrong / total * 100) + "%";

        },
        100
    );


    /* Answer review */

    const review =
        document.getElementById(
            "answerReview"
        );


    review.innerHTML = "";


    answers.forEach(
        (answer, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                answer.isCorrect
                ? "answer-card correct"
                : "answer-card wrong";


            if (answer.isCorrect) {

                card.innerHTML =

                    "<h4>" +
                    (index + 1) +
                    ". " +
                    answer.question +
                    "</h4>" +

                    '<p class="correct-text">' +
                    "✓ Correct Answer: " +
                    answer.correctAnswer +
                    "</p>" +

                    "<p>" +
                    "Your Answer: " +
                    answer.selectedAnswer +
                    "</p>";

            } else {

                card.innerHTML =

                    "<h4>" +
                    (index + 1) +
                    ". " +
                    answer.question +
                    "</h4>" +

                    '<p class="wrong-text">' +
                    "✗ Your Answer: " +
                    (
                        answer.selectedAnswer ||
                        "Not answered"
                    ) +
                    "</p>" +

                    '<p class="correct-text">' +
                    "✓ Correct Answer: " +
                    answer.correctAnswer +
                    "</p>";

            }


            review.appendChild(
                card
            );

        }
    );


    /* Scroll to result */

    setTimeout(
        function() {

            result.scrollIntoView({
                behavior: "smooth"
            });

        },
        200
    );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function goDashboard() {

    window.location.href =
        API_URL +
        "/student/dashboard.html";

}
